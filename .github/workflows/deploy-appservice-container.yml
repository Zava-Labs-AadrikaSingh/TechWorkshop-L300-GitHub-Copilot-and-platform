name: Build and deploy container to App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - .github/workflows/deploy-appservice-container.yml
  pull_request:
   branches: [ '*' ]

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: zavastorefront

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        run: |
          LOGIN_SERVER=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer --output tsv)
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Docker login to ACR
        run: |
          ACR_TOKEN=$(az acr login --name "${{ vars.ACR_NAME }}" --expose-token --query accessToken --output tsv)
          echo "$ACR_TOKEN" | docker login "$ACR_LOGIN_SERVER" --username "00000000-0000-0000-0000-000000000000" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}" ./src
          docker push "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Deploy image to App Service
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEB_APP_NAME }}" \
            --container-image-name "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}"